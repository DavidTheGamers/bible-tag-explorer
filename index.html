
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090b">
  <title>Bible Tag Explorer</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Bible Tag Explorer</h1>
      <p>Explore Scripture through your own tag system.</p>
    </div>
    <span class="version-badge">KJV</span>
  </header>

  <main class="workspace">
    <aside class="sidebar">
      <h2>Tags</h2>
      <input
        id="tagSearch"
        type="search"
        placeholder="Search tags..."
        aria-label="Search tags"
      >
      <div id="tagList" class="tag-list"></div>
    </aside>

    <section class="content">
      <div class="toolbar">
        <div>
          <h2 id="resultTitle">All Chapters</h2>
          <p id="resultCount">Loading chapters...</p>
        </div>
        <input
          id="chapterSearch"
          type="search"
          placeholder="Search books or chapters..."
          aria-label="Search books or chapters"
        >
      </div>

      <div id="statusMessage" class="status" role="status">
        Loading your Bible index...
      </div>

      <section id="chapterView">
        <div id="chapterList" class="chapter-list"></div>
      </section>

      <section id="readerView" hidden>
        <button id="backButton" class="back-button" type="button">
          ← Back to chapters
        </button>

        <div class="reader-heading">
          <h2 id="readerTitle">Bible Passage</h2>
          <p id="readerSubtitle">King James Version</p>
        </div>

        <div id="verseList" class="verse-list"></div>

        <section id="verseDetail" class="verse-detail" hidden>
          <p id="selectedVerseReference" class="verse-reference"></p>
          <p id="selectedVerseText" class="verse-text"></p>
          <button id="closeVerseButton" class="back-button" type="button">
            Close verse
          </button>
        </section>

        <p id="copyrightNotice" class="copyright"></p>
      </section>
    </section>
  </main>
</body>
</html>
